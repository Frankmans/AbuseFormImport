<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="260" fill="#eef1f5"/>

  <!-- modal card -->
  <rect x="40" y="24" width="560" height="212" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="64" y="58" font-size="15" font-weight="700" fill="#101828">Abuse Reports</text>
  <line x1="64" y1="72" x2="576" y2="72" stroke="#eaecf0" stroke-width="1"/>

  <!-- header row -->
  <text x="64" y="102" font-size="13" fill="#475467">312 reports across 96 tickets</text>

  <!-- icon group: envelope (Email Importer) -->
  <g transform="translate(508,84)">
    <circle cx="16" cy="16" r="16" fill="#f2f4f7"/>
    <rect x="8" y="10" width="16" height="12" rx="1.6" fill="none" stroke="#344054" stroke-width="1.6"/>
    <polyline points="8,11 16,17.5 24,11" fill="none" stroke="#344054" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- icon group: cog (Marker Style) -->
  <g transform="translate(548,84)">
    <circle cx="16" cy="16" r="16" fill="#f2f4f7"/>
    <circle cx="16" cy="16" r="4.2" fill="none" stroke="#344054" stroke-width="1.6"/>
    <g stroke="#344054" stroke-width="1.6" stroke-linecap="round">
      <line x1="16" y1="6" x2="16" y2="9"/>
      <line x1="16" y1="23" x2="16" y2="26"/>
      <line x1="26" y1="16" x2="23" y2="16"/>
      <line x1="9" y1="16" x2="6" y2="16"/>
      <line x1="22.7" y1="9.3" x2="20.6" y2="11.4"/>
      <line x1="11.4" y1="20.6" x2="9.3" y2="22.7"/>
      <line x1="22.7" y1="22.7" x2="20.6" y2="20.6"/>
      <line x1="11.4" y1="11.4" x2="9.3" y2="9.3"/>
    </g>
  </g>

  <!-- callouts -->
  <path d="M 524 136 C 524 165, 470 150, 440 172" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="440,172 449,170 445,178" fill="#dc2626"/>
  <rect x="288" y="172" width="156" height="46" rx="8" fill="#fff1f0" stroke="#dc2626" stroke-width="1.2"/>
  <text x="300" y="190" font-size="11.5" font-weight="700" fill="#991b1b">Envelope icon</text>
  <text x="300" y="206" font-size="11" fill="#7f1d1d">Opens Email Importer</text>

  <path d="M 564 136 C 564 158, 590 156, 590 172" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="590,172 583,166 587,175" fill="#dc2626"/>
  <rect x="450" y="172" width="140" height="46" rx="8" fill="#fff1f0" stroke="#dc2626" stroke-width="1.2"/>
  <text x="462" y="190" font-size="11.5" font-weight="700" fill="#991b1b">Cog icon</text>
  <text x="462" y="206" font-size="11" fill="#7f1d1d">Opens Marker Style</text>
</svg>
