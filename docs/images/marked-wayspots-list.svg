  <text x="154.0" y="99.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle" >Clear All</text>
  <rect x="26" y="120" width="14" height="14" rx="3" fill="#fff" stroke="#154aab" stroke-width="1" />
  <polyline points="29,127 32,131 38,123" fill="none" stroke="#154aab" stroke-width="2"/>
  <text x="48" y="132" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start" >Include notes when copying</text>
  <rect x="26" y="146" width="428" height="54" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1" />
  <text x="36" y="166" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start" >Example Park North Gate</text>
  <text x="420" y="166" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="10" fill="#667085" font-weight="normal" text-anchor="end" >1.234567, 1.234567</text>
  <text x="444" y="167" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#667085" font-weight="normal" text-anchor="end" >×</text>
  <text x="36" y="186" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="normal" text-anchor="start" >Fake name, nothing there</text>
  <rect x="26" y="208" width="428" height="54" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1" />
  <text x="36" y="228" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start" >(unnamed)</text>
  <text x="420" y="228" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="10" fill="#667085" font-weight="normal" text-anchor="end" >1.234567, 1.234567</text>
  <text x="444" y="229" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#667085" font-weight="normal" text-anchor="end" >×</text>
  <text x="36" y="248" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="normal" text-anchor="start" >Private property</text>
  <text x="26" y="286" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start" >Favorite Users</text>
  <text x="26" y="302" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="normal" text-anchor="start" >Click a username in the Wayfarer side panel to add or remove it here.</text>
  <rect x="26" y="312" width="80" height="26" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="66.0" y="329.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle" >Clear All</text>
