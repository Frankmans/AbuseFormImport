  <text x="444" y="370" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#667085" font-weight="normal" text-anchor="end" >×</text>
  <rect x="26" y="388" width="428" height="32" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1" />
  <text x="36" y="409" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#f59e0b" font-weight="700" text-anchor="start" >example_user</text>
  <text x="444" y="410" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#667085" font-weight="normal" text-anchor="end" >×</text>

