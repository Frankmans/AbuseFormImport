<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Marked Wayspots list with Favorite Users</title>
  <desc id="d">Illustrative mockup: the Marked Wayspots list window with Copy All, Clear All, the Include notes when copying checkbox, entries with editable notes, and a Favorite Users section below.</desc>
  <rect width="480" height="450" fill="#f8fafc"/>
  <rect x="10" y="10" width="460" height="430" rx="10" fill="#fff" stroke="#d0d5dd" stroke-width="1" />
  <rect x="10" y="10" width="460" height="38" rx="10" fill="#f1f5f9" stroke="#d0d5dd" stroke-width="1" />
  <text x="26" y="34" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start" >Abuse Reports - Marked Wayspots</text>
  <text x="462" y="34" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#667085" font-weight="normal" text-anchor="end" >✕</text>
  <text x="26" y="70" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="start" >Report abuse via Wayfarer Help Center ↗</text>
  <rect x="26" y="82" width="80" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
