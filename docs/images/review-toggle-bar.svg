<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="560" height="320" fill="#eef1f5"/>

  <!-- review card -->
  <rect x="40" y="24" width="480" height="272" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="64" y="58" font-size="14" font-weight="700" fill="#101828">Check for duplicates</text>
  <line x1="64" y1="72" x2="496" y2="72" stroke="#eaecf0" stroke-width="1"/>

  <!-- toggle bar -->
  <g>
    <text x="64" y="100" font-size="12.5" font-weight="600" fill="#111827">Abuse report markers</text>
    <rect x="452" y="86" width="44" height="20" rx="10" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
    <text x="474" y="100" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">On</text>
  </g>

  <!-- map area -->
  <rect x="64" y="116" width="432" height="156" rx="6" fill="#cfe3d8"/>
  <path d="M64 200 q80 -40 160 -10 t208 -10" fill="none" stroke="#9fc7b1" stroke-width="10" opacity="0.6"/>

  <!-- crosses on the map -->
  <g stroke="#dc2626" stroke-width="2.4">
    <line x1="170" y1="150" x2="182" y2="162"/>
    <line x1="182" y1="150" x2="170" y2="162"/>
  </g>
  <g stroke="#dc2626" stroke-width="2.4">
    <line x1="300" y1="200" x2="312" y2="212"/>
    <line x1="312" y1="200" x2="300" y2="212"/>
  </g>
  <circle cx="360" cy="150" r="12" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="360" y="154" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- callout -->
  <rect x="304" y="4" width="212" height="46" rx="8" fill="#fff1f0" stroke="#dc2626" stroke-width="1.2"/>
  <text x="316" y="22" font-size="11.5" font-weight="700" fill="#991b1b">Only appears on the</text>
  <text x="316" y="38" font-size="11.5" fill="#7f1d1d">review page -- own on/off</text>
  <path d="M 474 50 C 474 62, 474 74, 474 84" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="474,84 470,76 478,76" fill="#dc2626"/>
</svg>
