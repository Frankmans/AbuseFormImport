<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Wayspot details card in the side panel</title>
  <desc id="d">Illustrative mockup: a Wayspot details card with a clickable, colored submitter username, a ticket line with the last interaction date, and a note field with the add to abuse report draft button.</desc>
  <rect width="420" height="320" fill="#f8fafc"/>
  <rect x="10" y="10" width="400" height="300" rx="10" fill="#fff" stroke="#d0d5dd" stroke-width="1" />
  <text x="28" y="38" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start" >Example Park North Gate</text>
  <text x="28" y="56" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="normal" text-anchor="start" >52.006199, 4.535424</text>
  <text x="28" y="74" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="normal" text-anchor="start" >Submitted by </text>
  <text x="102" y="74" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#f59e0b" font-weight="700" text-anchor="start" >example_user</text>
  <rect x="28" y="92" width="150" height="20" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
  <text x="36" y="106" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#9a3412" font-weight="600" text-anchor="start" >#12345 — 3/14/2026</text>
  <rect x="28" y="122" width="180" height="26" rx="5" fill="#fff" stroke="#c7d2fe" stroke-width="1" />
  <text x="36" y="139.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#9ca3af" font-weight="normal" text-anchor="start" >Note (optional)</text>
  <rect x="216" y="122" width="178" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
  <text x="305.0" y="139.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="middle" >+ add to abuse report draft</text>
  <rect x="28" y="160" width="70" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="63" y="174" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#065f46" font-weight="600" text-anchor="middle" >Live</text>
  <line x1="330" y1="236" x2="330" y2="152" stroke="#154aab" stroke-width="1.2" stroke-linecap="round" />
  <polygon points="330,152 332.6,157.4 327.4,157.4" fill="#154aab"/>
  <text x="330" y="252" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="middle" >note field + add to the</text>
  <text x="330" y="266" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="middle" >Marked Wayspots list</text>
  <line x1="180" y1="236" x2="150" y2="106" stroke="#154aab" stroke-width="1.2" stroke-linecap="round" />
  <polygon points="150,106 153.8,110.7 148.7,111.9" fill="#154aab"/>
  <text x="180" y="252" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="middle" >ticket + date of</text>
  <text x="180" y="266" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="middle" >last interaction</text>
  <line x1="60" y1="236" x2="72" y2="80" stroke="#154aab" stroke-width="1.2" stroke-linecap="round" />
  <polygon points="72,80 74.2,85.6 69.0,85.2" fill="#154aab"/>
  <text x="60" y="252" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="middle" >click name =</text>
  <text x="60" y="266" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="middle" >favorite user</text>
  <text x="28" y="294" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="normal" text-anchor="start" font-style="italic">Favorited usernames are bold, in your chosen color.</text>

