<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="560" height="320" fill="#dbe4ee"/>

  <!-- map control button -->
  <rect x="380" y="24" width="90" height="34" rx="6" fill="#ffffff" stroke="#98a2b3" stroke-width="1.2"/>
  <text x="425" y="46" font-size="12.5" fill="#344054" text-anchor="middle">Layers</text>

  <!-- dropdown -->
  <rect x="330" y="64" width="200" height="150" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="346" y="88" font-size="12" font-weight="700" fill="#101828">Map Layers</text>
  <line x1="346" y1="98" x2="514" y2="98" stroke="#eaecf0" stroke-width="1"/>

  <g font-size="12.5" fill="#344054">
    <rect x="346" y="108" width="14" height="14" rx="3" fill="none" stroke="#98a2b3" stroke-width="1.3"/>
    <path d="M348.5 115 l3 3 l6 -7" fill="none" stroke="#344054" stroke-width="1.6"/>
    <text x="368" y="120">Wayspots</text>

    <rect x="346" y="134" width="14" height="14" rx="3" fill="none" stroke="#98a2b3" stroke-width="1.3"/>
    <path d="M348.5 141 l3 3 l6 -7" fill="none" stroke="#344054" stroke-width="1.6"/>
    <text x="368" y="146">Pok&#233;stops</text>

    <!-- highlighted entry -->
    <rect x="340" y="156" width="182" height="26" rx="6" fill="#eff8f0"/>
    <rect x="346" y="160" width="14" height="14" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="1.3"/>
    <path d="M348.5 167 l3 3 l6 -7" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text x="368" y="172" font-weight="700" fill="#15803d">Abuse Report Crosses</text>

    <rect x="346" y="188" width="14" height="14" rx="3" fill="none" stroke="#98a2b3" stroke-width="1.3"/>
    <text x="368" y="198">Power Spots</text>
  </g>

  <!-- callout -->
  <path d="M 330 169 C 260 169, 240 230, 180 230" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="180,230 189,226 189,234" fill="#dc2626"/>
  <rect x="24" y="198" width="180" height="62" rx="8" fill="#fff1f0" stroke="#dc2626" stroke-width="1.2"/>
  <text x="36" y="218" font-size="12" font-weight="700" fill="#991b1b">This is "Show on Map"</text>
  <text x="36" y="236" font-size="11" fill="#7f1d1d">now -- the plugin's own</text>
  <text x="36" y="250" font-size="11" fill="#7f1d1d">button was removed.</text>
</svg>
