  <text x="631" y="162.4" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">3</text>
  <rect x="652" y="110" width="30" height="24" rx="5" fill="#eef2ff" stroke="#c7d2fe"/><g transform="translate(659.1 114.1) scale(0.66)" fill="none" stroke="#154aab" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v4"/><path d="M12 20h.01"/></g>
