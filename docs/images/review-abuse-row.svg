  <rect x="580" y="110" width="30" height="24" rx="5" fill="#eef2ff" stroke="#c7d2fe"/><g transform="translate(587.1 114.1) scale(0.66)" fill="none" stroke="#154aab" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h9l-1.5 3.5L14 11H5"/><path d="M18 15v6"/><path d="M15 18h6"/></g>
