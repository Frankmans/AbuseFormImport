  <text x="40" y="160" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="start">note (optional): added to the copy, to the draft entry and to the auto-fill</text>
  <circle cx="35" cy="190" r="7" fill="#154aab"/>
  <text x="35" y="193.2" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">1</text>
  <text x="50" y="194" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="start">copy: name, lat, lng (+ the note), to the clipboard</text>
  <circle cx="35" cy="208" r="7" fill="#154aab"/>
  <text x="35" y="211.2" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">2</text>
  <text x="50" y="212" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="start">add to abuse report draft (the Marked Wayspots list), with the note</text>
  <circle cx="35" cy="226" r="7" fill="#154aab"/>
  <text x="35" y="229.2" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">3</text>
  <text x="50" y="230" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="start">auto-fill the abuse form for this review only: just this Wayspot and the note</text>
  <circle cx="35" cy="244" r="7" fill="#154aab"/>
  <text x="35" y="247.2" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">4</text>
  <text x="50" y="248" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#154aab" font-weight="600" text-anchor="start">open the abuse form: the Help Center article in a new tab</text>
  <text x="26" y="274" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#667085" font-weight="normal" text-anchor="start">Clipboard after clicking copy: Example Park North Gate, 1.234567, 1.234567 (fake name)</text>
