<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Review page abuse helper row</title>
  <desc id="d">Illustrative mockup: on the review page a row with a note field and four icon buttons: copy, add to abuse report draft, auto-fill the abuse form for this review only, and open the abuse form.</desc>
  <rect width="720" height="292" fill="#f8fafc"/>
  <rect x="10" y="10" width="700" height="272" rx="10" fill="#fff" stroke="#d0d5dd"/>
  <text x="26" y="34" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">Review — new Wayspot</text>
  <rect x="26" y="46" width="668" height="44" rx="6" fill="#f1f5f9" stroke="#e5e7eb"/>
  <text x="40" y="72" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#667085" font-weight="normal" text-anchor="start">(candidate details: title, description, photos …)</text>
  <rect x="26" y="102" width="668" height="40" rx="6" fill="#f0f4ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <rect x="36" y="109" width="496" height="26" rx="5" fill="#fff" stroke="#c7d2fe"/>
  <text x="44" y="126" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#9ca3af" font-weight="normal" text-anchor="start">Note (optional)</text>
