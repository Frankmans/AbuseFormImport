<svg xmlns="http://www.w3.org/2000/svg" width="480" height="262" viewBox="0 0 480 262" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Email Importer panel with the scan-after-import checkbox</title>
